container_type: DockerImage
# TODO: point this back at mlcommons/medperf-cc-chestxray:<version> once the
# image carrying the mock backend is published. Until then it is built from
# ../Dockerfile and served from a local registry -- see build.sh.
image: localhost:5555/medperf-cc-chestxray:test
tasks:
  run_script:
    input_volumes:
      data_path:
        mount_path: /mlcommons/volumes/data
        type: directory
      labels_path:
        mount_path: /mlcommons/volumes/labels
        type: directory
      model_files:
        mount_path: /mlcommons/volumes/model_files
        type: directory
    output_volumes:
      results_path:
        mount_path: /mlcommons/volumes/results
        type: directory
