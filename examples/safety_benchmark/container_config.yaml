container_type: DockerImage
# Built from ../Dockerfile and served from a local registry until the image is
# published -- see build.sh.
image: localhost:5555/medperf-safety-benchmark:test
tasks:
  run_script:
    input_volumes:
      data_path:
        mount_path: /mlcommons/volumes/data
        type: directory
      labels_path:
        mount_path: /mlcommons/volumes/labels
        type: directory
      model_files:
        mount_path: /mlcommons/volumes/model_files
        type: directory
    output_volumes:
      results_path:
        mount_path: /mlcommons/volumes/results
        type: directory
