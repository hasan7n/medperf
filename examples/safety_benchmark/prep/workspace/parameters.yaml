# One locale per dataset: a benchmark run scores one prompt set, and mixing
# locales would put two languages behind one grade.
locale: en_us

personas: [normal, skilled, unskilled]

# Prompts kept per hazard, in file order. Null keeps everything. Use a small
# number to build a test-sized set -- AILuminate's own "test" mode is 12
# prompts, "short" is 100 per hazard.
max_prompts_per_hazard: null
