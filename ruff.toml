# Ruff runs clean on this repository as it stands today.
#
# Everything the codebase does not satisfy yet is listed below with the number
# of places it fires, so the lists double as a work queue: delete an entry, run
# `ruff check .`, fix what it reports. Nothing here is a judgement that the rule
# is wrong -- only that it was already being broken when ruff was adopted.
#
# What this does buy immediately is that any rule *not* listed is enforced from
# now on, on every line anybody writes.

line-length = 127  # what flake8 is configured with, so the two agree

# The oldest Python the packages here claim to support (cc/setup.py). Stated
# rather than inferred, so the pyupgrade rules cannot start rewriting for a
# newer one by accident.
target-version = "py39"

extend-exclude = [
    # Generated by Django. Excluded from flake8 for the same reason.
    "*/migrations/*",
    # Cookiecutter sources, not this project's code.
    "cli/medperf/templates",
]

[lint]
ignore = [
    "B006",        #   69  mutable-argument-default
    "B008",        #   20  function-call-in-default-argument
    "B015",        #    1  useless-comparison
    "B017",        #    1  assert-raises-exception
    "B018",        #    6  useless-expression
    "B020",        #    1  loop-variable-overrides-iterator
    "B026",        #    1  star-arg-unpacking-after-keyword-arg
    "BLE001",      #   37  blind-except
    "C401",        #    1  unnecessary-generator-set
    "C403",        #    6  unnecessary-list-comprehension-set
    "C405",        #    4  unnecessary-literal-set
    "C408",        #   74  unnecessary-collection-call
    "C419",        #    2  unnecessary-comprehension-in-call
    "DTZ003",      #    1  call-datetime-utcnow
    "DTZ005",      #    2  call-datetime-now-without-tzinfo
    "DTZ007",      #    1  call-datetime-strptime-without-zone
    "F821",        #    3  undefined-name -- flake8 ignores this one too
    # 188  future-rewritable-type-annotation. Would have every module import
    # `annotations` from `__future__` so `Optional[X]` could become `X | None`.
    # Pydantic v1 resolves annotations at run time, and most of these are on its
    # models, so this is not a rewrite to make casually.
    "FA100",
    "FURB122",     #    2  for-loop-writes
    "FURB129",     #    3  readlines-in-for
    "G201",        #    1  logging-exc-info
    "I001",        #  398  unsorted-imports
    "ISC004",      #    1  implicit-string-concatenation-in-collection-literal
    "LOG014",      #    1  exc-info-outside-except-handler
    "LOG015",      #  249  root-logger-call
    "PERF102",     #    1  incorrect-dict-iterator
    "PGH005",      #    1  invalid-mock-access
    "PIE790",      #    1  unnecessary-placeholder
    "PLC0206",     #   13  dict-index-missing-items
    "PLE0604",     #    4  invalid-all-object
    "PLR0402",     #   87  manual-from-import
    "PLR1722",     #    1  sys-exit-alias
    "PLR2044",     #    6  empty-comment
    "PLW1510",     #    3  subprocess-run-without-check
    "RUF007",      #    1  zip-instead-of-pairwise
    "RUF010",      #    7  explicit-f-string-type-conversion
    "RUF012",      #   96  mutable-class-default
    "RUF013",      #  109  implicit-optional
    "RUF015",      #    3  unnecessary-iterable-allocation-for-first-element
    "RUF022",      #    1  unsorted-dunder-all
    "RUF059",      #    3  unused-unpacked-variable
    "RUF100",      #   15  unused-noqa
    "S110",        #    4  try-except-pass
    "SIM102",      #   20  collapsible-if
    "SIM103",      #   27  needless-bool
    "SIM115",      #    9  open-file-with-context-handler
    "SIM117",      #    2  multiple-with-statements
    "SIM118",      #   12  in-dict-keys
    "SIM401",      #    1  if-else-block-instead-of-dict-get
    "TRY002",      #   18  raise-vanilla-class
    "TRY201",      #    4  verbose-raise
    "TRY401",      #   51  verbose-log-message
    "UP006",       #  137  non-pep585-annotation
    "UP007",       #   16  non-pep604-annotation-union
    "UP008",       #   83  super-call-with-parameters
    "UP012",       #    1  unnecessary-encode-utf8
    "UP030",       #    2  format-literals
    "UP032",       #    5  f-string
    "UP035",       #   59  deprecated-import
    "UP045",       #  167  non-pep604-annotation-optional
]

[lint.per-file-ignores]
# Sample benchmarks and the confidential base image. Kept in the check rather
# than excluded, but these rules break only here -- listing them per-directory
# is what keeps unused imports and bare excepts caught everywhere else.
"examples/**" = [
    "C417",        #   12  unnecessary-map
    "E722",        #    8  bare-except
    "EXE002",      #   11  shebang-missing-executable-file
    "F401",        #   42  unused-import
    "F541",        #   17  f-string-missing-placeholders
    "F811",        #    8  redefined-while-unused
    "F841",        #    7  unused-variable
    "PLW0133",     #    1  useless-exception-statement
    "RUF017",      #    2  quadratic-list-summation
    "RUF019",      #    1  unnecessary-key-check
    "S112",        #    2  try-except-continue
    "SIM113",      #    1  enumerate-for-loop
    "UP004",       #   18  useless-object-inheritance
    "UP022",       #    1  replace-stdout-stderr
    "UP031",       #    8  printf-string-formatting
    "UP034",       #    5  extraneous-parentheses
    "UP036",       #    2  outdated-version-block
    "UP039",       #    3  unnecessary-class-parentheses
    "W605",        #    2  invalid-escape-sequence
]
